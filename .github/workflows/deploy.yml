name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: vue-project/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vue-project

      - name: Build
        run: npm run build
        working-directory: vue-project
        env:
          VITE_GOOGLE_MAPS_KEY: AIzaSyBE7mmsYZPxvtMOzenx5hvBWi6W_j5q0aw
          VITE_SUPABASE_URL: https://oixtemuwclwrjxkdkcyb.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_8rfsixsleXoYjWZL4z6SMQ_zDWAI0OQ

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vue-project/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
